<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HabitFlow | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8FAFC; }
        .sidebar-item:hover { background-color: #F1F5F9; color: #2563EB; }
        .sidebar-active { background-color: #EEF2FF; color: #2563EB; border-radius: 12px; }
        .habit-card { border-radius: 16px; background: #ffffff; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="flex">

    <aside class="w-72 h-screen bg-white border-r border-slate-200 sticky top-0 p-6 flex flex-col">
        <div class="flex items-center gap-3 mb-12 px-2">
            <div class="bg-blue-600 p-2 rounded-xl">
                <i class="fas fa-bolt text-white text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">HabitFlow</h1>
        </div>

        <nav class="space-y-2 flex-1">
            <a href="#" class="sidebar-active flex items-center gap-4 p-4 font-semibold transition-all">
                <i class="fas fa-home text-lg"></i> Dashboard
            </a>
            <a href="#" class="sidebar-item flex items-center gap-4 p-4 text-slate-500 font-medium transition-all rounded-xl">
                <i class="fas fa-list-check text-lg"></i> My Tasks
            </a>
            <a href="#" class="sidebar-item flex items-center gap-4 p-4 text-slate-500 font-medium transition-all rounded-xl">
                <i class="fas fa-chart-pie text-lg"></i> Analytics
            </a>
            <a href="#" class="sidebar-item flex items-center gap-4 p-4 text-slate-500 font-medium transition-all rounded-xl">
                <i class="fas fa-sliders text-lg"></i> Settings
            </a>
        </nav>

        <div class="mt-auto p-4 bg-slate-50 rounded-2xl flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center text-blue-600 font-bold">JD</div>
            <div>
                <p class="text-sm font-bold text-slate-800">John Doe</p>
                <p class="text-xs text-slate-500">Pro Member</p>
            </div>
        </div>
    </aside>

    <main class="flex-1 p-10">
        <header class="flex justify-between items-center mb-10">
            <h2 class="text-3xl font-bold text-slate-800 text-center">Home Dashboard</h2>
            <div class="text-slate-500 bg-white px-4 py-2 rounded-lg border border-slate-200 shadow-sm">
                <i class="far fa-calendar-alt mr-2"></i> January 03, 2026
            </div>
        </header>

        <section class="habit-card overflow-hidden border border-slate-100">
            <div class="p-6 border-b border-slate-50 flex justify-between items-center bg-white">
                <h3 class="text-xl font-bold text-slate-800">Habit Tracker (Weekly)</h3>
                <div class="flex gap-4 items-center">
                    <span class="flex items-center gap-2 text-sm font-medium text-slate-600">
                        <span class="w-3 h-3 bg-blue-500 rounded-full"></span> Done
                    </span>
                    <span class="flex items-center gap-2 text-sm font-medium text-slate-600">
                        <span class="w-3 h-3 bg-slate-200 rounded-full"></span> Pending
                    </span>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/50">
                            <th class="p-5 text-xs font-bold text-slate-400 uppercase tracking-wider">Habit Name</th>
                            <th class="p-5 text-center text-xs font-bold text-slate-400 uppercase tracking-wider">Sa</th>
                            <th class="p-5 text-center text-xs font-bold text-slate-400 uppercase tracking-wider">Su</th>
                            <th class="p-5 text-center text-xs font-bold text-slate-400 uppercase tracking-wider">Mo</th>
                            <th class="p-5 text-center text-xs font-bold text-slate-400 uppercase tracking-wider">Tu</th>
                            <th class="p-4 text-center text-xs font-bold text-slate-400 uppercase tracking-wider bg-blue-50 text-blue-600 border-x border-blue-100">We</th>
                            <th class="p-5 text-center text-xs font-bold text-slate-400 uppercase tracking-wider">Th</th>
                            <th class="p-5 text-center text-xs font-bold text-slate-400 uppercase tracking-wider">Fr</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100 bg-white">
                        <tr class="hover:bg-slate-50/80 transition-colors">
                            <td class="p-5 font-semibold text-slate-700">5:30 AM Wake Up ⏰</td>
                            <td class="p-5 text-center"><input type="checkbox" checked class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                            <td class="p-5 text-center"><input type="checkbox" class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                            <td class="p-5 text-center"><input type="checkbox" class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                            <td class="p-5 text-center"><input type="checkbox" checked class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                            <td class="p-5 text-center bg-blue-50/30 border-x border-blue-50"><input type="checkbox" checked class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                            <td class="p-5 text-center"><input type="checkbox" class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                            <td class="p-5 text-center"><input type="checkbox" class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                        </tr>
                        <tr class="hover:bg-slate-50/80 transition-colors">
                            <td class="p-5 font-semibold text-slate-700">Cold Shower 🚿</td>
                            <td class="p-5 text-center"><input type="checkbox" checked class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                            <td class="p-5 text-center"><input type="checkbox" checked class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                            <td class="p-5 text-center"><input type="checkbox" checked class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                            <td class="p-5 text-center"><input type="checkbox" class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                            <td class="p-5 text-center bg-blue-50/30 border-x border-blue-50"><input type="checkbox" checked class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                            <td class="p-5 text-center"><input type="checkbox" class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                            <td class="p-5 text-center"><input type="checkbox" class="w-5 h-5 accent-blue-600 cursor-pointer"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="p-4 bg-slate-50 border-t border-slate-100 flex justify-end">
                <button class="text-blue-600 font-bold hover:underline text-sm">+ Add New Habit</button>
            </div>
        </section>
    </main>

</body>
</html>
